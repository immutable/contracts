[profile.default]
src = "contracts"
out = "foundry-out"
libs = ["lib"]
test = "test"
cache_path = "cache"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Seaport stack (matches former Hardhat per-file overrides: viaIR + runs=10)
additional_compiler_profiles = [
  { name = "seaport-via-ir", via_ir = true, optimizer = true, optimizer_runs = 10 },
]

compilation_restrictions = [
  { paths = "lib/seaport/**", via_ir = true, optimizer_runs = 10 },
  { paths = "contracts/trading/seaport/**", via_ir = true, optimizer_runs = 10 },
  { paths = "contracts/trading/seaport16/**", via_ir = true, optimizer_runs = 10 },
]